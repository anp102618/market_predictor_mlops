name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"  # Daily at 8:00 AM IST
  workflow_dispatch:

env:
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/market_predictor_mlops.mlflow

jobs:
  build-train-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r app_requirements.txt
          pip install -r requirements.txt || true

      - name: Configure Git
        run: |
          git config --global user.name "anp102618"
          git config --global user.email "a.n.prasad155@gmail.com"

      - name: Set Up DVC and Remote
        run: |
          pip install dvc[http]  # or dvc[s3], dvc[gs], etc., based on your remote
          dvc remote add -f -d origin_remote https://dagshub.com/${DAGSHUB_USERNAME}/market_predictor_mlops.dvc || true
          dvc remote modify origin_remote auth basic
          dvc remote modify --local origin_remote user ${DAGSHUB_USERNAME}
          dvc remote modify --local origin_remote password ${DAGSHUB_TOKEN}
          dvc config core.autostage true

      - name: Run Training Script
        run: python main.py

      - name: Track Experiment in MLflow
        run: python src/Experiment_Tracking_Prediction.py

      - name: Delink & Add Files to DVC
        run: |
          for file in Data/new_data/final_data.csv Data/new_data/model.joblib Data/new_data/mlflow_details.yaml Data/new_data/time_series_predictions.yaml; do
            git rm --cached "$file" || true
            dvc add "$file"
          done

      - name: Commit DVC Changes
        run: |
          git add Data/new_data/*.dvc .gitignore
          git commit -m "Auto: Track model artifacts via DVC" || echo "Nothing to commit"
          git push origin main

      - name: DVC Push Artifacts
        run: dvc push

      - name: Pull DVC Artifacts (simulate cron fresh env)
        run: |
          rm -f Data/new_data/*.csv Data/new_data/*.yaml Data/new_data/*.joblib
          dvc pull

      - name: Run Model Promotion Tests
        run: python -m unittest Test_Script/test_model_promotion.py

      - name: Generate Timestamp Tag
        id: timestamp
        run: echo "TAG=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          TAG=${{ steps.timestamp.outputs.TAG }}
          IMAGE_NAME=${{ env.DOCKERHUB_USERNAME }}/market_prediction_app:$TAG
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
